name: CarSpotter
options:
  bundleIdPrefix: app.carsspotter
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  CarSpotter:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CarSpotter
        excludes:
          - Resources/Info.plist.template
    info:
      path: CarSpotter/Info.plist
      properties:
        CFBundleDisplayName: CarSpotter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: CarSpotter uses the camera to identify cars instantly.
        NSPhotoLibraryUsageDescription: Pick a photo from your library to identify the car.
        NSLocationWhenInUseUsageDescription: Show car-spotting hotspots near you on the map.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.carsspotter
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFirestoreSwift
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseStorage
    entitlements:
      path: CarSpotter/CarSpotter.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
